name: app_bep_xinh
description: "app benh xinh: for research"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  phosphoricons_flutter: ^1.0.0
  # Font cho control adaptive trong DevicePreview và thư viện phụ thuộc.
  cupertino_icons: ^1.0.8




  #logic
  flutter_bloc: ^9.1.1
  go_router: ^18.1.0
  fpdart: ^1.1.0


  #ui
  google_nav_bar: ^5.0.7
  google_fonts: ^6.2.1

  #animation
  flutter_animate: ^4.5.2


   #check_internet
  connectivity_plus: ^7.0.0

  # debug giao diện
  device_preview: ^1.3.1
  #build
  build_runner: ^2.17.1
  flutter_screenutil: ^5.9.3
  flutter_spinkit: 5.2.2
  responsive_framework: ^1.5.1
  equatable: ^3.0.0
  carousel_slider: ^5.1.2
  smooth_page_indicator: ^3.0.0
  image_picker: ^1.2.4
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  http: ^1.6.0
  crypto: ^3.0.8
  google_sign_in: 7.2.0
  shared_preferences: 2.5.6
  share_plus: 13.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/mock/
    - assets/nutrition/
    - assets/fonts/be_vietnam_pro/OFL.txt
  fonts:
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/be_vietnam_pro/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/be_vietnam_pro/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/be_vietnam_pro/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/be_vietnam_pro/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/be_vietnam_pro/BeVietnamPro-ExtraBold.ttf
          weight: 800
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/be_vietnam_pro/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/be_vietnam_pro/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/be_vietnam_pro/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/be_vietnam_pro/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/be_vietnam_pro/BeVietnamPro-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"

name: app_bep_xinh
description: "app benh xinh: for research"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8




  #logic
  flutter_bloc: ^9.1.1
  go_router: ^18.1.0
  fpdart: ^1.1.0 
  

  #ui
  google_nav_bar: ^5.0.7
  google_fonts: ^6.2.1

  #animation
  flutter_animate: ^4.5.2


   #check_internet
  connectivity_plus: ^7.0.0
  
  # debug giao diện
  device_preview: ^1.3.1
  #build
  build_runner: ^2.17.1
  responsive_framework: ^1.5.1
  equatable: ^3.0.0
  convex_bottom_bar: ^3.2.0
  carousel_slider: ^5.1.2
  smooth_page_indicator: ^3.0.0
  image_picker: ^1.2.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/mock/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
